<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M04 | Midterm</title>
<script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (e.matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });
  </script>
  <style>
    textarea, input, button, a {
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }
  </style>
</head>
<body class="h-full bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans antialiased p-4 md:p-8 flex items-start justify-center">
<div class="w-full max-w-3xl">
<div class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg p-6 md:p-8 border border-gray-200 dark:border-gray-700 transition-colors">
<h2 class="text-3xl md:text-4xl font-bold tracking-tight text-gray-800 dark:text-white mb-6 border-b pb-2 border-gray-200 dark:border-gray-700">SDEV 245 | Module 4 Midterm</h2>
<div class="space-y-4">
<p class="text-base font-medium text-gray-700 dark:text-gray-300">Enter a message or upload a file:</p>
<textarea id="message" placeholder="Enter message" rows="4" class="w-full rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 p-3 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:focus:ring-blue-400 focus:border-transparent font-mono text-sm transition"></textarea>
<div class="flex items-center gap-3">
<span class="text-sm font-semibold text-gray-500 dark:text-gray-400">OR</span>
<div class="flex-1 border-t border-gray-200 dark:border-gray-700"></div>
</div>
<input type="file" id="fileInput" class="block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 dark:file:bg-blue-900/30 file:text-blue-700 dark:file:text-blue-300 hover:file:bg-blue-100 dark:hover:file:bg-blue-900/50 cursor-pointer border border-gray-300 dark:border-gray-600 rounded-xl bg-white dark:bg-gray-900 p-2 transition"/>
</div>

<div class="flex flex-wrap gap-3 mt-6">
<button id="encrypt" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition">🔒 Encrypt</button>

<button id="decrypt" class="inline-flex items-center justify-center rounded-xl bg-emerald-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition">🔓 Decrypt</button>
</div>

<div class="mt-8 space-y-5">
<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Original SHA-256 Hash:</h3>
<p id="originalHash" class="mt-1 break-all rounded-lg bg-gray-100 dark:bg-gray-900 p-3 font-mono text-sm text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700">...</p>
</div>

<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Encrypted Data:</h3>
<p id="cipher" class="mt-1 break-all rounded-lg bg-gray-100 dark:bg-gray-900 p-3 font-mono text-sm text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700">...
</p>
</div>

<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Decrypted Data:</h3>
<p id="plain" class="mt-1 break-all rounded-lg bg-gray-100 dark:bg-gray-900 p-3 font-mono text-sm text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700 min-h-[2.5rem]">...</p>
</div>

<div>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400">Integrity Check:</h3>
<p id="result" class="mt-1 break-all rounded-lg bg-gray-100 dark:bg-gray-900 p-3 font-mono text-sm font-medium text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-gray-700">...</p>
</div>
</div>
<a id="download" hidden class="mt-6 inline-flex items-center justify-center rounded-xl bg-purple-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800 transition">
⬇️ Download Decrypted File</a>
</div>
<p class="text-center text-xs text-gray-400 dark:text-gray-600 mt-6">
Made with ❤ by K.S.</p>
</div>
<script src="./script.js" defer></script>
</body>
</html>
