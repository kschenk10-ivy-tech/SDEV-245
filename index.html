  <body>
    <h1>Role-Based Access Control and Authentication Login Simulation</h1>

    <button onclick="login('admin')">Login as Admin</button>
    <button onclick="login('user')">Login as User</button>
    <hr />

    <button onclick="adminAction()">Admin Action</button>
    <button onclick="userAction()">User Action</button>

    <div id="output">Not logged in.</div>

    <script>
      const users = {
        admin: { role: "admin" },
        user: { role: "user" },
      };

      let currentUser = null;

      function login(username) {
        currentUser = users[username];

        document.getElementById(
          "output"
        ).textContent = `Logged in as ${username} (${currentUser.role})`;
      }

      function adminAction() {
        if (!currentUser) {
          show("Access denied: Please log in.");
          return;
        }

        if (currentUser.role !== "admin") {
          show("Access denied: Admins only.");
          return;
        }

        show("Admin action executed.");
      }

      function userAction() {
        if (!currentUser) {
          show("Access denied: Please log in.");
          return;
        }

        if (currentUser.role !== "user") {
          show("Access denied: Users only.");
          return;
        }

        show("User action executed.");
      }

      function show(message) {
        document.getElementById("output").textContent = message;
      }
    </script>
    <!-- <script src="" async defer></script> -->
  </body>
</html>
