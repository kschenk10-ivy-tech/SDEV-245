<!DOCTYPE html>
<html>

<head>
  <title>Hash + Encrypt + Verify</title>
</head>

<body>
  <h3>Encrypt & Verify</h3>
  <textarea id="input" rows="4" cols="50" placeholder="Enter message..."></textarea><br>
  <button id="encrypt">Encrypt</button>
  <button id="decrypt">Decrypt & Verify</button>
  <pre id="output"></pre>

  <script>
    const bufToB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    let encryptedData = null;
    async function sha256(bytes) {
      return crypto.subtle.digest("SHA-256", bytes);
    }
    async function getKey() {
      const rawKey = new Uint8Array(32).fill(1);
      return crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["encrypt", "decrypt"]);
    }
    document.getElementById("encrypt").onclick = async () => {
      const text = document.getElementById("input").value;
      const bytes = new TextEncoder().encode(text);
      const hash = await sha256(bytes);
      const key = await getKey();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ciphertext = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv }, key, bytes
      );
      encryptedData = {
        iv: bufToB64(iv),
        ciphertext: bufToB64(ciphertext),
        hash: bufToB64(hash)
      };
      document.getElementById("output").textContent =
        "Encrypted:\n" + JSON.stringify(encryptedData, null, 2);
    };
    document.getElementById("decrypt").onclick = async () => {
      if (!encryptedData) return alert("Encrypt something first");
      const key = await getKey();
      const iv = b64ToBuf(encryptedData.iv);
      const ciphertext = b64ToBuf(encryptedData.ciphertext);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv }, key, ciphertext
      );
      const decryptedHash = await sha256(decrypted);
      const expectedHash = b64ToBuf(encryptedData.hash);
      const match =
        bufToB64(decryptedHash) === bufToB64(expectedHash);
      document.getElementById("output").textContent =
        "Decrypted: " + new TextDecoder().decode(decrypted) +
        "\nIntegrity: " + (match ? "✅ PASS" : "❌ FAIL");
    };
  </script>
</body>

</html>
